spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sdt_webapp_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/dev-realms
          jwk-set-uri: http://localhost:8080/realms/dev-realm/protocol/openid-connect/certs

  mail:
    host: smtp.gmail.com
    port: 587
    username: johnkevin.moraca@chmsu.edu.ph      # Your sending Gmail address
    password: yzai ukpt gwfh dlbh      # 16-character Google App Password (not your account password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  management:
    endpoint:
      health:
        show-details: always
    endpoints:
      web:
        exposure:
          include: "health,info,metrics,prometheus,env,beans"
  logging:
    level:
      root: INFO
      com.sdt: DEBUG
      org.springframework.security: DEBUG
      org.springframework.web: DEBUG

app:
  frontend-url: http://localhost:4200
  security:
    cookie:
      name: REFRESH_TOKEN
      secure: false           # HTTP development on localhost / LAN
      same-site: Lax          # Lax allows cookies on same-site/localhost over HTTP
      path: /                 # Root path makes cookie visible across endpoints and in browser DevTools
      max-age-seconds: 604800 # 7 days
    refresh-token:
      expose-in-body: true    # Exposes refreshToken in response body for frontend persistence in dev