spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.test-provider.com
          jwk-set-uri: https://auth.test-provider.com/certs
          audiences:
            - "api://sdt-webapp"

  mail:
    host: localhost
    port: 2525

app:
  security:
    rate-limiting:
      enabled: false
    cookie:
      name: REFRESH_TOKEN
      secure: true
      same-site: Lax
      path: /api/public/auth

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false
  server:
    port: "" # Disables separate management port so endpoints are accessible via MockMvc
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  prometheus:
    metrics:
      export:
        enabled: true