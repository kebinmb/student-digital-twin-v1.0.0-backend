spring:
  application:
    name: sdt-webapp

  profiles:
    active: dev

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: SecureHikariCP

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 25
          batch_versioned_data: true

  security:
    oauth2:
      resourceserver:
        jwt:
          audiences:
            - "api://sdt-webapp"

grpc:
  server:
    port: 9090
    security:
      enabled: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  equity:
    encryption-key: ${EQUITY_ENCRYPTION_KEY:c2R0LWVxdWl0eS1hZXMtMjU2LWtleS1kZXYtMzJieXRlcyE=}
  security:
    cookie:
      name: ${COOKIE_NAME:REFRESH_TOKEN}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      path: ${COOKIE_PATH:/}
      domain: ${COOKIE_DOMAIN:}
      max-age-seconds: ${COOKIE_MAX_AGE:604800}
    refresh-token:
      expose-in-body: ${REFRESH_TOKEN_EXPOSE_BODY:true}